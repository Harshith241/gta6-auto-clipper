[project]
name = "gta6-auto-clipper"
version = "0.1.0"
description = "Turn Twitch/Kick GTA 6 VODs into ready-to-post 9:16 Shorts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.10.0",
    "chat-downloader>=0.2.8",
    "faster-whisper>=1.2.1",
    "numpy>=2.4.6",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scipy>=1.17.1",
    "typer>=0.29.2",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
clipper = "clipper.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "clipper"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
